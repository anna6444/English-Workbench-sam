<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法音律：H军团的召唤</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', sans-serif;
            background: #0f172a; background-image: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #fff; overflow: hidden;
        }
        
        .game-container {
            background: rgba(30, 27, 75, 0.6); border: 2px solid #818cf8;
            border-radius: 24px; width: 100%; max-width: 420px; padding: 20px;
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.3), inset 0 0 20px rgba(129, 140, 248, 0.1);
            display: flex; flex-direction: column; backdrop-filter: blur(5px);
        }

        .top-bar { display: flex; justify-content: space-between; font-size: 16px; color: #c7d2fe; margin-bottom: 20px;}
        
        .story-box {
            background: rgba(255,255,255,0.05); border-left: 4px solid #f472b6; border-radius: 10px;
            padding: 15px; font-size: 15px; color: #fbcfe8; margin-bottom: 20px; line-height: 1.5;
        }

        /* 召唤阵区域 */
        .summon-circle {
            display: flex; justify-content: center; align-items: center; gap: 20px; margin: 30px 0;
            background: rgba(0,0,0,0.3); padding: 25px; border-radius: 50%; border: 2px dashed #818cf8;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.2) inset;
        }
        .slot {
            width: 60px; height: 70px; border: 2px solid #6366f1; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; font-size: 32px; color: #fff;
            background: rgba(99, 102, 241, 0.2);
        }
        .plus { font-size: 24px; color: #a5b4fc; }
        
        /* 字母点击池 */
        .letter-pool {
            display: flex; justify-content: center; gap: 15px; margin-top: 20px;
        }
        .letter-btn {
            width: 60px; height: 70px; background: linear-gradient(135deg, #f472b6, #db2777);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #9d174d;
            transition: all 0.1s; color: white;
        }
        .letter-btn:active { transform: translateY(6px); box-shadow: none; }
        .letter-btn.used { opacity: 0; pointer-events: none; }

        /* 拼写区域 (合成后出现) */
        .spell-area { display: flex; justify-content: center; gap: 10px; margin-top: 30px; opacity: 0; transition: opacity 0.5s;}
        .spell-area.show { opacity: 1; }
        .spell-slot {
            width: 50px; height: 60px; background: rgba(255,255,255,0.1); border-bottom: 3px solid #a5b4fc;
            display: flex; justify-content: center; align-items: center; font-size: 28px; color: #fff;
        }
        .spell-slot.filled { border-bottom-color: #4ade80; text-shadow: 0 0 10px #4ade80; }

        .toast {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            background: rgba(244, 114, 182, 0.9); color: white; padding: 12px 24px; border-radius: 20px;
            font-weight: bold; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100;
            font-size: 18px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; top: 20%; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="toast" id="toast">提示</div>

<div class="game-container">
    <div class="top-bar">
        <div>👑 人类公主</div>
        <div>🔮 H军团召唤</div>
    </div>

    <div class="story-box" id="story">
        前方遇到了野怪！公主，快把平民字母 <b>c</b> 和 <b>h</b> 送入召唤阵，合成“H骑士团 (ch)”，释放魔法！
    </div>

    <!-- 召唤阵 -->
    <div class="summon-circle">
        <div class="slot" id="slot-c"></div>
        <div class="plus">+</div>
        <div class="slot" id="slot-h"></div>
    </div>

    <!-- 字母池 -->
    <div class="letter-pool" id="pool">
        <div class="letter-btn" onclick="summonLetter('h', this)">h</div>
        <div class="letter-btn" onclick="summonLetter('c', this)">c</div>
    </div>

    <!-- 拼读区域 -->
    <div class="spell-area" id="spell-area">
        <div class="story-box" style="text-align:center; border:none; color:#f472b6; font-weight:bold; padding-bottom:0;">
            骑士团出击！拼出单词：<b>chair</b> (椅子)
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
            <div class="spell-slot filled">c</div>
            <div class="spell-slot filled">h</div>
            <div class="spell-slot" id="s1"></div>
            <div class="spell-slot" id="s2"></div>
            <div class="spell-slot" id="s3"></div>
        </div>
        <div class="letter-pool" id="pool2">
            <div class="letter-btn" onclick="spellWord('a', this)">a</div>
            <div class="letter-btn" onclick="spellWord('r', this)">r</div>
            <div class="letter-btn" onclick="spellWord('i', this)">i</div>
        </div>
    </div>
</div>

<script>
    function playSound(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // --- 第一阶段：合成 ch ---
    let hasC = false;
    let hasH = false;

    function summonLetter(letter, btn) {
        if (letter === 'c' && !hasC) {
            document.getElementById('slot-c').innerText = 'c';
            btn.classList.add('used');
            hasC = true;
            playSound('c');
        } else if (letter === 'h' && !hasH) {
            document.getElementById('slot-h').innerText = 'h';
            btn.classList.add('used');
            hasH = true;
            playSound('h');
        }

        if (hasC && hasH) {
            setTimeout(() => {
                document.getElementById('slot-c').style.borderColor = '#4ade80';
                document.getElementById('slot-h').style.borderColor = '#4ade80';
                showToast("✨ 召唤成功！H骑士团 (ch) 诞生！");
                playSound('ch');
                
                setTimeout(() => {
                    document.getElementById('story').innerHTML = "太棒了！<b>ch</b> 骑士发出 [tʃ] 的声音。现在，用骑士团的魔法拼出 <b>chair</b>！";
                    document.getElementById('spell-area').classList.add('show');
                }, 1500);
            }, 500);
        }
    }

    // --- 第二阶段：拼写 chair ---
    const targetWord = ['a', 'i', 'r']; // c 和 h 已经在前面了
    let currentIndex = 0;

    function spellWord(letter, btn) {
        if (letter === targetWord[currentIndex]) {
            let slot = document.getElementById('s' + (currentIndex + 1));
            slot.innerText = letter;
            btn.classList.add('used');
            playSound(letter);
            
            currentIndex++;
            
            if (currentIndex === 3) {
                setTimeout(() => {
                    playSound('chair');
                    showToast("🎉 完美！你打败了野怪，获得了 H军团碎片！");
                    document.getElementById('story').innerHTML = "🎉 <b>chair</b> 拼读成功！魔法门又多了一块碎片。";
                    document.getElementById('story').style.color = "#4ade80";
                    document.getElementById('story').style.borderLeftColor = "#4ade80";
                }, 500);
            }
        } else {
            btn.style.transform = "translateX(5px)";
            setTimeout(() => btn.style.transform = "translateX(-5px)", 100);
            setTimeout(() => btn.style.transform = "translateX(0)", 200);
            playSound("wrong");
        }
    }
</script>
</body>
</html>
