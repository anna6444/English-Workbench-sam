<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法小公主的拼读奇遇</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #ff9a9e; 
            background-image: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #6a1b9a; overflow: hidden;
        }
        
        /* 飘动的星星魔法背景 */
        .magic-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background-image: radial-gradient(#fff 10%, transparent 10%), radial-gradient(#fff 10%, transparent 10%);
            background-size: 30px 30px; background-position: 0 0, 15px 15px;
            opacity: 0.3; z-index: -1; animation: floatBg 10s linear infinite;
        }
        @keyframes floatBg { from { transform: translateY(0); } to { transform: translateY(-30px); } }

        .game-container {
            background: rgba(255, 255, 255, 0.85); border: 4px solid #fff;
            border-radius: 30px; width: 100%; max-width: 400px; padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.2), inset 0 0 20px rgba(255, 182, 193, 0.5);
            position: relative; display: flex; flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .top-bar { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #d81b60;}
        .progress-bg { width: 100%; height: 12px; background: #f8bbd0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 1px solid #f48fb1;}
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ab47bc, #d81b60); transition: width 0.5s; border-radius: 10px;}

        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 300px;}
        
        /* 童话故事框 */
        .story-box {
            background: #fce4ec; border: 2px dashed #f06292; border-radius: 20px; padding: 20px;
            font-size: 16px; color: #ad1457; margin-bottom: 25px; line-height: 1.6;
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.1); position: relative;
        }
        .story-box::before {
            content: '✨'; position: absolute; top: -15px; left: 20px; font-size: 24px;
        }

        /* 魔法宠物对话框 */
        .pet-dialog {
            display: flex; align-items: flex-end; gap: 10px; margin-bottom: 15px;
        }
        .pet-avatar {
            font-size: 40px; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bubble {
            background: #fff; border: 2px solid #f06292; border-radius: 15px; padding: 10px 15px;
            font-size: 14px; color: #333; position: relative;
        }

        /* 字母魔法阵 */
        .magic-circle { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .letter-slot {
            width: 50px; height: 60px; background: #fff; border: 3px solid #ce93d8; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; color: #ab47bc;
            box-shadow: 0 0 10px rgba(206, 147, 216, 0.5); transition: all 0.3s;
        }
        .letter-slot.filled { background: #f3e5f5; border-color: #ab47bc; box-shadow: 0 0 20px #ab47bc; }

        .letter-pool { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .letter-btn {
            width: 55px; height: 60px; background: linear-gradient(135deg, #f06292 0%, #d81b60 100%);
            border-radius: 15px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; color: #fff; cursor: pointer;
            box-shadow: 0 5px 0 #ad1457, 0 8px 15px rgba(216, 27, 96, 0.4); transition: all 0.1s;
        }
        .letter-btn:active { transform: translateY(5px); box-shadow: none; }
        .letter-btn.used { opacity: 0.3; pointer-events: none; }

        /* 按钮 */
        .btn {
            background: linear-gradient(135deg, #ce93d8 0%, #ab47bc 100%); color: white; border: none; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 20px;
            box-shadow: 0 6px 0 #8e24aa, 0 10px 20px rgba(142, 36, 170, 0.3); transition: all 0.1s;
        }
        .btn:active { transform: translateY(6px); box-shadow: none; }

        .hidden { display: none !important; }
        
        .win-screen { text-align: center; }
        .win-title { font-size: 26px; color: #d81b60; font-weight: bold; margin: 15px 0; text-shadow: 1px 1px 0 #fff;}
    </style>
</head>
<body>
<div class="magic-bg"></div>

<div class="game-container">
    <div class="top-bar">
        <div>👑 魔法学员</div>
        <div>🪄 魔力值: <span id="power-count">0</span></div>
    </div>

    <div class="progress-bg"><div class="progress-bar" id="progress"></div></div>

    <!-- 关卡1：剧情引入与咒语吟唱 -->
    <div id="stage1" class="content">
        <div class="story-box">
            糟糕！A 公主被森林里的“闭音节”魔法变成了小绵羊，发出的声音变成了短促的 <b>[æ]</b>！<br>
            小魔女，快用你的魔法棒，拼出咒语唤醒她！
        </div>
        
        <div class="pet-dialog">
            <div class="pet-avatar">🐱</div>
            <div class="bubble">喵~ 主人，请按顺序点亮符文 <b>c - a - t</b> 来施法！</div>
        </div>

        <div class="magic-circle">
            <div class="letter-slot" id="slot0"></div>
            <div class="letter-slot" id="slot1"></div>
            <div class="letter-slot" id="slot2"></div>
        </div>
        
        <div class="letter-pool" id="letter-pool">
            <div class="letter-btn" onclick="castSpell('t', this)">t</div>
            <div class="letter-btn" onclick="castSpell('c', this)">c</div>
            <div class="letter-btn" onclick="castSpell('a', this)">a</div>
        </div>
    </div>

    <!-- 关卡2：魔法成功 -->
    <div id="stage2" class="content hidden win-screen">
        <div style="font-size: 80px; animation: bounce 1s infinite;">🐱👑</div>
        <div class="win-title">施法成功！</div>
        <div style="font-size: 20px; color: #ab47bc; margin-bottom: 20px;">
            c - a - t 👉 <b style="font-size: 32px; color: #d81b60;">cat</b>
        </div>
        <p style="color:#666; font-size: 15px;">你成功拼出了猫的咒语，A 公主恢复了部分魔力！</p>
        <button class="btn" onclick="location.reload()">继续下一关</button>
    </div>
</div>

<script>
    let power = 0;
    const powerDisplay = document.getElementById('power-count');
    const progressBar = document.getElementById('progress');

    // 播放音效
    function playSound(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
    }

    // 关卡逻辑：拼写 c-a-t
    const targetWord = ['c', 'a', 't'];
    let currentIndex = 0;

    function castSpell(letter, element) {
        if (letter === targetWord[currentIndex]) {
            // 选对了
            let slot = document.getElementById('slot' + currentIndex);
            slot.innerText = letter;
            slot.classList.add('filled');
            
            // 魔法特效：选对时按钮消失，字母飞入槽位
            element.classList.add('used');
            playSound(letter === 'a' ? 'æ' : letter); // 短元音 a 的发音用 æ 模拟
            
            // 增加魔力值
            power += 10;
            powerDisplay.innerText = power;
            progressBar.style.width = `${(currentIndex + 1) / 3 * 100}%`;

            currentIndex++;
            
            // 拼写完成
            if (currentIndex === 3) {
                setTimeout(() => {
                    playSound('cat');
                    document.getElementById('stage1').classList.add('hidden');
                    document.getElementById('stage2').classList.remove('hidden');
                }, 500);
            }
        } else {
            // 选错了
            element.style.transform = "translateX(5px)";
            setTimeout(() => element.style.transform = "translateX(-5px)", 100);
            setTimeout(() => element.style.transform = "translateX(0)", 200);
            playSound("wrong"); // 假装有个错误音效
        }
    }
</script>
</body>
</html>
