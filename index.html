<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法音律：公主回家之路</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            /* 参考图1的草地背景色 */
            background: #b5e48c; 
            background-image: radial-gradient(#d9ed92 10%, transparent 10%);
            background-size: 40px 40px;
            width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        
        /* 游戏主容器（平板宽屏适配） */
        .game-app {
            width: 100%; height: 100%; max-width: 1200px; position: relative; display: flex; flex-direction: column;
        }

        /* 顶部状态栏 */
        .top-bar {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .user-info {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.7); padding: 5px 20px 5px 5:px; border-radius: 30px; box-shadow: 0  center4px 10px rgba;(0 justify-content,0,0:,0.1);
        }
 center       ;

 50px; background:        
 #ffd54f; border       -radius: 50%; /* display: flex; justify-content : center; align-items: center; font模拟-size: 28px; border: 3px solid #fff; }
        .level { font-weight: bold; color: #2d6a4f; font-size: 18px; }
        
        .resources { display: flex; gap: 15px; }
        .res-item {
            background: rgba(255,255,255,0.8); padding: 8px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 5px; font-weight: bold; color: #d81b60; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 中间地图关卡区域 */
        .map-container {
            flex: 1; position: relative; width: 100%; display: flex; align-items关卡路径 (用相对定位摆放) */
        .level-node {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.2s;
        }
        .level-node:active { transform: scale(0.95); }
        
        .node-circle {
            width: 120px; height: 120px; border-radius: 50%; background: #fff;
            border: 6px solid #81c784; display: flex; justify-content: center; align-items: center;
            font-size: 50px; box-shadow: 0 8px 15px rgba(0,0,0,0.15); position: relative;
        }
        
        /* 当前可玩节点发光效果 */
        .node-circle.active {
            border-color: #ffca28; box-shadow: 0 0 30px #ffca28;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 锁定的节点 */
        .node-circle.locked { background: #e0e0e0; border-color: #bdbdbd; opacity: 0.8; }
        
        .node-title {
            margin-top: 10px; background: #52b788; color: #fff; padding: 5px 15px;
            border-radius: 15px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #2d6a4f;
        }

        /* 星星 */
        .stars { position: absolute; top: -25px; display: flex; gap: 5px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);}

        /* 底部进度条 */
        .bottom-progress {
            height: 60px; margin: 0 20px 20px 20px; background: rgba(255,255,255,0.6);
            border-radius: 30px; display: flex; align-items: center; padding: 0 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative;
        }
        .progress-text { font-weight: bold; color: #2d6a4f; margin-right: 20px; z-index: 2;}
        .progress-track { flex: 1; height: 15px; background: #d8f3dc; border-radius: 10px; position: relative; }
        .progress-fill { width: 20%; height: 100%; background: linear-gradient(90deg, #74c69d, #40916c); border-radius: 10px; transition: width 0.5s; }
        
        /* --- 弹窗系统 --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: #fff9e6; width: 600px; border-radius: 30px; padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative;
            transform: translateY(20px); transition: transform 0.3s;
            border: 4px solid #ffca28;
        }
        .modal-overlay.show .modal-card { transform: translateY(0); }
        
        .close-btn {
            position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
            background: #e0e0e0; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 20px; color: #666; cursor: pointer;
        }

        /* 战报弹窗专属样式 */
        .report-title { text-align: center; font-size: 28px; color: #d81b60; font-weight: bold; margin-bottom: 20px;}
        .report-content { display: flex; align-items: center; gap: 20px; }
        .princess-avatar { font-size: 100px; flex-shrink: 0; background: #e0f7fa; border-radius: 20px; padding: 20px;}
        .stats-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-box { background: #fff; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
        .stat-label { font-size: 14px; color: #888; }
        .stat-value { font-size: 24px; font-weight: bold; color: #333; margin-top: 5px;}
        .btn-claim {
            display: block; width: 60%; margin: 20px auto 0; padding: 15px;
            background: #00e676; color: #fff; font-size: 20px; font-weight: bold;
            border-radius: 30px; border: none; cursor: pointer; box-shadow: 0 6px 0 #00b248;
        }

        /* 成就弹窗专属样式 */
        .achieve-grid { display: flex; justify-content: space-around; margin: 30px 0; }
        .badge {
            width: 100px; height: 100px; background: #e0e0e0; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; position: relative;
        }
        .badge.unlocked { background: #42a5f5; box-shadow: 0 0 15px #90caf9;}
        .badge.unlocked.bronze { background: #ff9800; box-shadow: 0 0 15px #ffb74d;}
        .badge span { font-size: 30px; }

    </style>
</head>
<body>

<div class="game-app">
    <!-- 顶部状态 -->
    <div class="top-bar">
        <div class="user-info" onclick="openModal('modal-report')">
            <div class="avatar">👸</div>
            <div class="level">Lv.1 魔法学徒</div>
        </div>
        <div class="resources">
            <div class="res-item">⭐ 星星: 12</div>
            <div class="res-item">💎 碎片: 3/5</div>
            <div class="res-item" onclick="openModal('modal-achieve')">🏆 成就</div>
        </div>
    </div>

    <!-- 地图区域 -->
    <div class="map-container">
        <!-- 节点1：已完成 -->
        <div class="level-node" style="left: 10%; top: 50%;">
            <div class="stars">⭐⭐⭐</div>
            <div class="node-circle">🏰</div>
            <div class="node-title">起源之石</div>
        </div>

        <!-- 节点2：当前解锁 -->
        <div class="level-node" style="left: 35%; top: 30%;" onclick="openModal('modal-report')">
            <div class="node-circle active">👸</div>
            <div class="node-title">H军团召唤</div>
        </div>

        <!-- 节点3：未解锁 -->
        <div class="level-node" style="left: 60%; top: 60%;">
            <div class="node-circle locked">🔒</div>
            <div class="node-title">绵羊之石</div>
        </div>

        <!-- 节点4：最终目标 -->
        <div class="level-node" style="left: 85%; top: 40%;">
            <div class="node-circle locked" style="background:#ffecb3; border-color:#ffca28;">🚪</div>
            <div class="node-title">魔法门</div>
        </div>
    </div>

    <!-- 底部进度条 -->
    <div class="bottom-progress">
        <div class="progress-text">回家进度</div>
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

<!-- 弹窗：战报结算 -->
<div class="modal-overlay" id="modal-report">
    <div class="modal-card">
        <div class="close-btn" onclick="closeModal('modal-report')">×</div>
        <div class="report-title">通关战报</div>
        <div class="report-content">
            <div class="princess-avatar">👸✨</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">拼读正确</div>
                    <div class="stat-value" style="color:#4caf50;">5 个</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">收集碎片</div>
                    <div class="stat-value" style="color:#2196f3;">2 枚</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">星级评价</div>
                    <div class="stat-value" style="color:#ff9800;">⭐⭐⭐</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">奖励星星</div>
                    <div class="stat-value">+ 50 ⭐</div>
                </div>
            </div>
        </div>
        <button class="btn-claim" onclick="closeModal('modal-report')">领取奖励</button>
    </div>
</div>

<!-- 弹窗：成就与魔法石 -->
<div class="modal-overlay" id="modal-achieve">
    <div class="modal-card">
        <div class="close-btn" onclick="closeModal('modal-achieve')">×</div>
        <div class="report-title" style="color: #2196f3;">魔法石收集册</div>
        <div class="achieve-grid">
            <div class="badge bronze"><span>💎</span><br>起源石</div>
            <div class="badge"><span>💎</span><br>绵羊石</div>
            <div class="badge"><span>💎</span><br>救赎石</div>
            <div class="badge"><span>💎</span><br>友谊石</div>
        </div>
        <p style="text-align: center; color: #666;">集齐 11 块魔法石，就能打开时空魔法门回家啦！</p>
        <button class="btn-claim" onclick="closeModal('modal-achieve')" style="background:#42a5f5; box-shadow: 0 6px 0 #1565c0;">继续收集</button>
    </div>
</div>

<script>
    // 弹窗控制逻辑
    function openModal(id) {
        document.getElementById(id).classList.add('show');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }
</script>
</body>
</html>
