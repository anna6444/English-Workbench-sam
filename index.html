<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级拼读：英雄R的崛起</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Baloo 2', 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #2b1055;
            background-image: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #fff;
            overflow: hidden;
        }
        
        /* 星星背景动画 */
        .stars-bg {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px);
            background-size: 50px 50px; opacity: 0.3; z-index: -1;
            animation: moveStars 20s linear infinite;
        }
        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 0 500px; } }

        .game-container {
            background: rgba(255, 255, 255, 0.95); border-radius: 24px; 
            width: 100%; max-width: 420px; padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 10px rgba(255,255,255,0.5);
            position: relative; overflow: hidden; color: #333;
            display: flex; flex-direction: column;
        }

        /* 顶部状态栏 */
        .top-bar { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ff5722;}
        .status-item { display: flex; align-items: center; gap: 5px; }
        
        /* 进度条 */
        .progress-bg { width: 100%; height: 12px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden;}
        .progress-bar { height: 100%; width: 33%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); transition: width 0.5s; border-radius: 10px;}

        /* 内容区 */
        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 250px;}

        .story-box {
            background: #fff3e0; border: 2px dashed #ffb74d; border-radius: 15px;
            padding: 15px; font-size: 15px; color: #e65100; margin-bottom: 20px;
            line-height: 1.6; text-align: left;
        }

        .btn {
            background: #ff9a9e; background-image: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d81b60; border: none; padding: 15px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 6px 0 #e91e63, 0 8px 10px rgba(0,0,0,0.1);
            transition: all 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #e91e63; }
        
        .btn-blue { background-image: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); color: #004ba0; box-shadow: 0 6px 0 #1565c0; }
        .btn-blue:active { box-shadow: 0 0px 0 #1565c0; }

        .hidden { display: none !important; }

        /* 单词展示 */
        .word-display {
            font-size: 50px; font-weight: bold; color: #333; margin: 15px 0; text-align: center;
            letter-spacing: 4px; text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
        }
        .phonetic { font-size: 20px; color: #555; font-family: monospace; text-align: center;}
        .highlight-r { color: #e91e63; animation: pulse 1s infinite; display:inline-block;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); text-shadow: 0 0 10px #ff4081;} 100% { transform: scale(1); } }

        /* 选项卡片 */
        .option-card {
            background: white; border: 2px solid #b3e5fc; border-radius: 15px;
            padding: 15px; margin: 10px 0; text-align: center; font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s;
        }
        .option-card:active { transform: scale(0.98); }
        .option-card.correct { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; }
        .option-card.wrong { background: #ffcdd2; border-color: #f44336; color: #c62828; }

        /* 拼读魔法阵 */
        .magic-circle {
            display: flex; justify-content: center; gap: 12px; margin: 25px 0;
        }
        .letter-slot {
            width: 55px; height: 65px; background: rgba(255,255,255,0.6);
            border: 3px dashed #64b5f6; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; color: #1565c0;
        }
        .letter-slot.filled { border-style: solid; background: #e3f2fd; animation: popIn 0.3s; }
        @keyframes popIn { 0% { transform: scale(0.5); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .letter-pool { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px;}
        .letter-btn {
            width: 55px; height: 65px; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; color: #333; cursor: pointer;
            box-shadow: 0 5px 0 #bbb; transition: all 0.1s;
        }
        .letter-btn:active { transform: translateY(5px); box-shadow: none; }
        .letter-btn.used { opacity: 0; pointer-events: none; }

        /* 通关撒花 */
        .win-screen { text-align: center; padding: 20px;}
        .win-title { font-size: 32px; color: #ff9800; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 0 #fff;}
        
        /* 浮动提示 */
        .toast {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 16px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>
<div class="stars-bg"></div>
<div class="toast" id="toast">提示信息</div>

<div class="game-container">
    <!-- 顶部状态 -->
    <div class="top-bar">
        <div class="status-item">❤️ ❤️ ❤️</div>
        <div class="status-item">⭐️ <span id="coin-count">0</span></div>
    </div>

    <!-- 进度条 -->
    <div class="progress-bg"><div class="progress-bar" id="progress"></div></div>

    <!-- 关卡1：剧情与听音辨位 -->
    <div id="stage1" class="content">
        <div class="story-box">
            <b>剧情：</b>拳击手 Rick 以前像小树苗一样弱（词首弱音 /r/），常被欺负。但他苦练拳法，变身后带上了火焰（词尾强音 /r/）！
        </div>
        <div class="word-display" style="font-size: 30px;">听一听，找出变身后的 Rick</div>
        
        <button class="btn btn-blue" onclick="playSound('red')">🔊 播放 red</button>
        <button class="btn btn-blue" onclick="playSound('fire')">🔊 播放 fire</button>
        
        <div class="option-card" onclick="checkAnswer(this, false)">选 red (树苗弱音)</div>
        <div class="option-card" onclick="checkAnswer(this, true)">选 fire (火焰强音)</div>
    </div>

    <!-- 关卡2：拼读魔法阵 -->
    <div id="stage2" class="content hidden">
        <div class="story-box">
            <b>魔法拼读：</b>请按顺序点击字母，拼出单词 <b>fire</b>（火）。<br>
            <i>提示：词尾的 Rick 需要变身哦！</i>
        </div>
        
        <div class="magic-circle">
            <div class="letter-slot" id="slot0"></div>
            <div class="letter-slot" id="slot1"></div>
            <div class="letter-slot" id="slot2"></div>
            <div class="letter-slot" id="slot3"></div>
        </div>
        
        <div class="letter-pool" id="letter-pool">
            <div class="letter-btn" onclick="selectLetter('e', this)">e</div>
            <div class="letter-btn" onclick="selectLetter('r', this)">r</div>
            <div class="letter-btn" onclick="selectLetter('f', this)">f</div>
            <div class="letter-btn" onclick="selectLetter('i', this)">i</div>
        </div>
    </div>

    <!-- 关卡3：通关结算 -->
    <div id="stage3" class="content hidden win-screen">
        <div style="font-size: 80px; animation: pulse 1s infinite;">🏆</div>
        <div class="win-title">闯关成功！</div>
        <div class="phonetic" style="font-size: 24px; margin-bottom: 20px;">
            <span class="highlight-r">fire</span> [ 'faɪə(r) ]
        </div>
        <p style="color:#666;">你已经掌握了词尾 R 的变身魔法！</p>
        <button class="btn" onclick="location.reload()">再玩一次</button>
    </div>
</div>

<script>
    let coins = 0;
    const coinDisplay = document.getElementById('coin-count');
    const progressBar = document.getElementById('progress');

    // 提示动画
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 增加金币
    function addCoin() {
        coins += 10;
        coinDisplay.innerText = coins;
    }

    // 语音合成
    function playSound(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 停止上一条
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }
    }

    // --- 关卡1逻辑 ---
    function checkAnswer(element, isCorrect) {
        if (isCorrect) {
            element.classList.add('correct');
            addCoin();
            showToast("🎉 太棒了！就是这个带火焰的 Rick！");
            playSound("Great job! fire");
            setTimeout(() => {
                document.getElementById('stage1').classList.add('hidden');
                document.getElementById('stage2').classList.remove('hidden');
                progressBar.style.width = '66%';
            }, 1500);
        } else {
            element.classList.add('wrong');
            showToast("❌ 再仔细听听，red 的 r 是弱音哦~");
            setTimeout(() => element.classList.remove('wrong'), 800);
        }
    }

    // --- 关卡2逻辑 ---
    const targetWord = ['f', 'i', 'r', 'e'];
    let currentIndex = 0;

    function selectLetter(letter, element) {
        if (letter === targetWord[currentIndex]) {
            // 选对了
            let slot = document.getElementById('slot' + currentIndex);
            slot.innerText = letter;
            slot.classList.add('filled');
            element.classList.add('used');
            playSound(letter);
            
            currentIndex++;
            if (currentIndex === 4) {
                setTimeout(() => {
                    playSound('fire');
                    addCoin();
                    document.getElementById('stage2').classList.add('hidden');
                    document.getElementById('stage3').classList.remove('hidden');
                    progressBar.style.width = '100%';
                }, 500);
            }
        } else {
            // 选错了
            showToast("顺序不对哦，再想想？");
            element.style.transform = "translateX(5px)";
            setTimeout(() => element.style.transform = "translateX(-5px)", 100);
            setTimeout(() => element.style.transform = "translateX(0)", 200);
        }
    }
</script>
</body>
</html>
