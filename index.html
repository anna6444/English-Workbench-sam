<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法公主：回家之路</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            /* 极简浅草绿背景，模拟参考图 */
            background-color: #c4eb9d; 
            background-image: radial-gradient(#a3d977 2px, transparent 2px);
            background-size: 30px 30px;
            width: 100vw; height: 100vh; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            color: #333;
        }
        
        /* 游戏主容器 */
        .game-app {
            width: 100%; height: 100%; max-width: 1200px; position: relative; display: flex; flex-direction: column;
            background: linear-gradient(to bottom, #b3e68c 0%, #c4eb9d 30%, #d4f0b8 100%);
        }

        /* 顶部状态栏 (参考图1的胶囊样式) */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; z-index: 10;
        }
        
        .user-info {
            display: flex; align-items: center; gap: 8px;
            background: #7bbf5f; padding: 6px 16px 6px 8px; 
            border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .user-icon {
            width: 32px; height: 32px; background: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        .level { font-weight: bold; color: #fff; font-size: 15px; letter-spacing: 1px;}
        
        .resources { display: flex; gap: 12px; }
        .res-item {
            width: 45px; height: 45px; background: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 20px; cursor: pointer;
            position: relative;
        }
        .res-badge {
            position: absolute; bottom: -5px; right: -5px; background: #ffca28; 
            font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px;
            border: 2px solid #fff; color: #fff;
        }

        /* 中间地图区域 (横向滑动) */
        .map-wrapper {
            flex: 1; display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
            padding: 0 40px; scrollbar-width: none; /* 隐藏滚动条 */
        }
        .map-wrapper::-webkit-scrollbar { display: none; }
        
        .map-track {
            display: flex; align-items: center; gap: 40px; min-width: max-content; padding-bottom: 20px;
        }

        /* 关卡节点通用 */
        .level-node {
            display: flex; flex-direction: column; align-items: center; position: relative;
            cursor: pointer; transition: transform 0.2s;
        }
        .level-node:active { transform: scale(0.95); }
        
        /* 圆形游戏节点 (参考图下方的圆) */
        .node-circle {
            width: 100px; height: 100px; border-radius: 50%; background: #fff;
            border: 4px solid #e0e0e0; display: flex; justify-content: center; align-items: center;
            font-size: 45px; box-shadow: 0 6px 0 rgba(0,0,0,0.05);
            position: relative;
        }
        
        /* 书本章节节点 (参考图中间的书籍) */
        .node-book {
            width: 110px; height: 140px; background: #fff; border-radius: 8px 12px 12px 8px;
            border-left: 10px solid #dcdcdc; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); position: relative;
        }
        .node-book .book-label { position: absolute; top: 10px; left: 10px; background: #b3e5fc; color: #0288d1; font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .node-book .book-title { font-size: 16px; font-weight: bold; color: #555; text-align: center; margin-top: 20px; line-height: 1.2;}
        .node-book .book-icon { font-size: 40px; margin-top: 10px; }

        /* 激活状态的节点 */
        .node-circle.active { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.8); }
        
        /* 标签 */
        .node-label {
            margin-top: -15px; background: rgba(0,0,0,0.3); color: #fff; padding: 4px 15px;
            border-radius: 15px; font-weight: bold; font-size: 13px; white-space: nowrap; z-index: 2;
        }
        .node-book + .node-label { margin-top: 10px; background: rgba(0,0,0,0.2); }

        /* 星星 (绝对定位在顶部) */
        .stars { position: absolute; top: -25px; display: flex; gap: 2px; font-size: 22px; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));}
        .star { color: #ffca28; }
        .star.empty { color: #e0e0e0; }

        /* 底部进度条 (参考图3) */
        .bottom-progress {
            height: 60px; display: flex; justify-content: center; align-items: center; gap: 10px;
            padding-bottom: 20px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #7bbf5f; background: transparent; }
        .dot.filled { background: #7bbf5f; }
        .dot.current { width: 24px; height: 12px; border-radius: 10px; background: #7bbf5f; border-color: #7bbf5f; display: flex; justify-content: center; align-items: center;}
        .dot.current::after { content: '🚩'; font-size: 12px; position: absolute; top: -15px;}
        .dot.final { border: none; font-size: 20px; }

    </style>
</head>
<body>

<div class="game-app">
    <!-- 顶部状态栏 -->
    <div class="top-bar">
        <div class="user-info">
            <div class="user-icon">👸</div>
            <div class="level">Lv.1 学习中心</div>
        </div>
        <div class="resources">
            <div class="res-item">🏆<div class="res-badge" style="background:#42a5f5;">12</div></div>
            <div class="res-item">💎<div class="res-badge">3/5</div></div>
            <div class="res-item">🌍</div>
        </div>
    </div>

    <!-- 地图区域 (横向滑动) -->
    <div class="map-wrapper">
        <div class="map-track">
            
            <!-- 节点1：已完成圆圈 -->
            <div class="level-node">
                <div class="stars">
                    <span class="star">★</span><span class="star">★</span><span class="star">★</span>
                </div>
                <div class="node-circle">🏰</div>
                <div class="node-label">起源之石</div>
            </div>

            <!-- 节点2：章节书本 -->
            <div class="level-node">
                <div class="node-book">
                    <div class="book-label">第一章</div>
                    <div class="book-title">魔法<br>觉醒</div>
                    <div class="book-icon">📖</div>
                </div>
                <div class="node-label">字母赐名</div>
            </div>

            <!-- 节点3：当前可玩圆圈 -->
            <div class="level-node" onclick="alert('准备进入拼写关卡！')">
                <div class="stars">
                    <span class="star empty">★</span><span class="star empty">★</span><span class="star empty">★</span>
                </div>
                <div class="node-circle active" style="background:#fff9c4;">👸</div>
                <div class="node-label" style="background:#ffb7b2;">H军团</div>
            </div>

            <!-- 节点4：未解锁圆圈 -->
            <div class="level-node">
                <div class="node-circle" style="background:#f0f0f0; opacity:0.7;">🔒</div>
                <div class="node-label" style="background:#bdbdbd;">绵羊之石</div>
            </div>

            <!-- 节点5：最终目标 -->
            <div class="level-node">
                <div class="node-circle" style="background:#fff3e0; border-color:#ffcc80;">🚪</div>
                <div class="node-label" style="background:#ff9800;">魔法门</div>
            </div>

        </div>
    </div>

    <!-- 底部进度点 -->
    <div class="bottom-progress">
        <div class="dot filled"></div>
        <div class="dot filled"></div>
        <div class="dot current"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot final">🏆</div>
    </div>
</div>

<script>
    // 简单的拖拽滑动逻辑，方便在电脑上用鼠标滑
    const slider = document.querySelector('.map-wrapper');
    let isDown = false;
    let startX;
    let scrollLeft;

    slider.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
    });
    slider.addEventListener('mouseleave', () => { isDown = false; });
    slider.addEventListener('mouseup', () => { isDown = false; });
    slider.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2; 
        slider.scrollLeft = scrollLeft - walk;
    });
</script>
</body>
</html>
