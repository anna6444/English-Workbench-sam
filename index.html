<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>字母王国奇遇记</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Baloo 2', 'Comic Sans MS', 'PingFang SC', sans-serif;
            background: #0f2027; background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #fff; overflow: hidden;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95); border-radius: 24px; width: 100%; max-width: 420px;
            padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; color: #333;
            display: flex; flex-direction: column;
        }

        .top-bar { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #d84315;}
        .progress-bg { width: 100%; height: 10px; background: #e0e0e0; border-radius: 10px; margin-bottom: 20px; overflow: hidden;}
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff8a00, #e52e71); transition: width 0.5s; border-radius: 10px;}

        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 300px;}
        .story-box {
            background: #fff8e1; border-left: 5px solid #ffc107; border-radius: 10px; padding: 15px;
            font-size: 15px; color: #5d4037; margin-bottom: 20px; line-height: 1.5;
        }

        /* 赐名大典：国王与平民 */
        .kingdom-area { display: flex; align-items: center; justify-content: space-between; background: #e3f2fd; padding: 15px; border-radius: 15px; border: 2px dashed #2196f3;}
        .king-box { width: 60px; height: 80px; background: #ffd54f; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; color: #f57f17; box-shadow: 0 4px 0 #ffb300; }
        .drop-zone { flex: 1; margin-left: 15px; min-height: 80px; background: rgba(255,255,255,0.6); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; align-items: center;}

        /* 字母卡片 */
        .letter-card {
            width: 45px; height: 55px; background: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: #333; cursor: pointer; box-shadow: 0 4px 0 #ccc; border: 1px solid #ddd;
        }
        .letter-card:active { transform: translateY(4px); box-shadow: none; }
        
        .options-pool { display: flex; justify-content: center; gap: 15px; margin-top: 30px;}
        
        /* 按钮 */
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 6px 0 #4a3b6b; transition: all 0.1s; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #4a3b6b; }

        .hidden { display: none !important; }
        .toast { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 16px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;}
        .toast.show { opacity: 1; }
        
        .win-screen { text-align: center; }
        .win-title { font-size: 28px; color: #e52e71; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
<div class="toast" id="toast">提示</div>

<div class="game-container">
    <div class="top-bar">
        <div>🏰 字母王国</div>
        <div>⭐️ <span id="coin-count">0</span></div>
    </div>

    <div class="progress-bg"><div class="progress-bar" id="progress"></div></div>

    <!-- 关卡1：A国王赐名 -->
    <div id="stage1" class="content">
        <div class="story-box">
            <b>任务一：A国王的狮吼功</b><br>
            A国王发音是 [eɪ]，他只会把名字赐给名字里带有 [eɪ] 音的辅音。请把对应的辅音拖进（点进）魔法阵！
        </div>
        
        <div class="kingdom-area">
            <div class="king-box">A</div>
            <div class="drop-zone" id="a-drop-zone"></div>
        </div>

        <div class="options-pool" id="stage1-pool">
            <div class="letter-card" onclick="giveName('H', this, true)">H</div>
            <div class="letter-card" onclick="giveName('B', this, false)">B</div>
            <div class="letter-card" onclick="giveName('J', this, true)">J</div>
            <div class="letter-card" onclick="giveName('K', this, true)">K</div>
        </div>
        <button class="btn hidden" id="btn-next1" onclick="nextStage(2)">前往谜语森林</button>
    </div>

    <!-- 关卡2：谜语森林 -->
    <div id="stage2" class="content hidden">
        <div class="story-box">
            <b>任务二：森林猜谜</b><br>
            在字母王国里，字母的发音常常和单词很像哦！
        </div>
        
        <div style="font-size: 22px; font-weight: bold; text-align: center; margin: 20px 0; color: #e52e71;" id="riddle-text">
            谜题加载中...
        </div>

        <div class="options-pool" id="stage2-pool">
            <!-- 动态生成选项 -->
        </div>
    </div>

    <!-- 通关 -->
    <div id="stage3" class="content hidden win-screen">
        <div style="font-size: 80px;">🏆</div>
        <div class="win-title">第二章通关！</div>
        <p>你成功帮助了字母王国，并学会了联想记忆法！</p>
        <button class="btn" onclick="location.reload()">重新体验</button>
    </div>
</div>

<script>
    let coins = 0;
    const coinDisplay = document.getElementById('coin-count');
    const progressBar = document.getElementById('progress');

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function addCoin() {
        coins += 10;
        coinDisplay.innerText = coins;
    }

    function playSound(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
    }

    // --- 关卡1：赐名大典 ---
    let aFound = 0;
    function giveName(letter, element, isCorrect) {
        if (isCorrect) {
            element.classList.add('used');
            element.style.visibility = 'hidden';
            playSound(letter);
            addCoin();
            showToast(`✅ ${letter} 的名字里有 A 音！`);
            
            // 克隆一个放进魔法阵
            let clone = document.createElement('div');
            clone.className = 'letter-card';
            clone.innerText = letter;
            clone.style.background = '#c8e6c9';
            document.getElementById('a-drop-zone').appendChild(clone);

            aFound++;
            if (aFound === 3) {
                progressBar.style.width = '50%';
                document.getElementById('btn-next1').classList.remove('hidden');
                showToast("🎉 完美！A国王赐名完成！");
            }
        } else {
            showToast(`❌ 错啦，B 的发音是 [bi:]，里面没有 A 的音。`);
            element.style.transform = "translateX(5px)";
            setTimeout(() => element.style.transform = "translateX(-5px)", 100);
            setTimeout(() => element.style.transform = "translateX(0)", 200);
        }
    }

    // --- 关卡2：谜语森林 ---
    const riddles = [
        { text: "哪个字母会飞？(提示：像小蜜蜂🐝)", ans: "B", sound: "bee", options: ["B", "C", "T"] },
        { text: "你可以在哪个字母里游泳？(提示：大海🌊)", ans: "C", sound: "sea", options: ["A", "C", "R"] },
        { text: "哪个字母代表你的眼睛？(提示：眼睛👁️)", ans: "I", sound: "eye", options: ["E", "I", "O"] },
        { text: "哪个字母可以被喝掉？(提示：茶🍵)", ans: "T", sound: "tea", options: ["P", "T", "V"] }
    ];
    let currentRiddle = 0;

    function nextStage(stage) {
        document.getElementById('stage1').classList.add('hidden');
        document.getElementById('stage2').classList.add('hidden');
        document.getElementById('stage3').classList.add('hidden');
        
        if (stage === 2) {
            document.getElementById('stage2').classList.remove('hidden');
            loadRiddle();
        } else {
            document.getElementById('stage3').classList.remove('hidden');
            progressBar.style.width = '100%';
        }
    }

    function loadRiddle() {
        if (currentRiddle >= riddles.length) {
            nextStage(3);
            return;
        }

        let r = riddles[currentRiddle];
        document.getElementById('riddle-text').innerText = r.text;
        
        let pool = document.getElementById('stage2-pool');
        pool.innerHTML = '';
        
        // 打乱选项
        let shuffled = r.options.sort(() => Math.random() - 0.5);
        
        shuffled.forEach(opt => {
            let btn = document.createElement('div');
            btn.className = 'letter-card';
            btn.innerText = opt;
            btn.onclick = () => checkRiddle(opt, r.ans, btn, r.sound);
            pool.appendChild(btn);
        });
    }

    function checkRiddle(selected, correct, btn, sound) {
        if (selected === correct) {
            btn.style.background = '#c8e6c9';
            playSound(sound);
            addCoin();
            showToast(`✨ 太聪明了！${correct} 的发音就是 ${sound}`);
            progressBar.style.width = `${50 + ((currentRiddle + 1) / 4) * 50}%`;
            
            // 禁用所有按钮
            let allBtns = document.querySelectorAll('#stage2-pool .letter-card');
            allBtns.forEach(b => b.onclick = null);

            currentRiddle++;
            setTimeout(loadRiddle, 1500);
        } else {
            btn.style.background = '#ffcdd2';
            showToast("不对哦，再联想一下发音~");
            setTimeout(() => btn.style.background = '#fff', 800);
        }
    }
</script>
</body>
</html>
