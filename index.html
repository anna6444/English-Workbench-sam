<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FDE8F0" />
<title>魔法公主 · 英语拼读奇遇记</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   《魔法公主：英语拼读奇遇记》
   设计规范：
   · 主色：樱花粉 #F7C6DA / 玫瑰金 #D9A88C / 珍珠白 #FFFCFE / 淡紫 #C9B6E8
   · 玻璃拟态：rgba(255,255,255,.55) + backdrop-filter: blur(18px)
   ═══════════════════════════════════════════════════════════════════ */

:root{
  --pink-50:#FFF7FA;  --pink-100:#FDE8F0; --pink-200:#F9D3E1;
  --pink-300:#F2B0C8; --pink-400:#E88BAC; --pink-500:#D96A92;
  --rose-gold:#D9A88C; --rose-gold-deep:#C48B6C;
  --lav-100:#F0EAFB; --lav-200:#E2D7F6; --lav-300:#C9B6E8;
  --lav-400:#A98FD6; --lav-500:#8B6FBF;
  --pearl:#FFFCFE;
  --ink:#5A4652;      --ink-soft:#8B7684; --ink-mute:#AB97A3;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.9);
  --shadow-sm:0 4px 14px rgba(184,132,160,.10);
  --shadow-md:0 10px 30px rgba(184,132,160,.14), 0 2px 6px rgba(184,132,160,.06);
  --shadow-lg:0 20px 54px rgba(160,110,140,.18), 0 6px 16px rgba(160,110,140,.08);
  --shadow-in:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.4);
  --radius-lg:28px; --radius-md:22px; --radius-sm:16px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  --serif:"Songti SC","STSong",Georgia,serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font); color:var(--ink); background:#FDF1F6;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

#bg{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(120% 90% at 12% 0%, #FFFFFF 0%, rgba(255,255,255,0) 46%),
    radial-gradient(95% 80% at 92% 8%, #F3E9FF 0%, rgba(243,233,255,0) 55%),
    radial-gradient(90% 75% at 50% 108%, #FBDCEA 0%, rgba(251,220,234,0) 62%),
    linear-gradient(160deg,#FFF6FA 0%,#FCEAF3 34%,#F4EAFB 70%,#EFE4FA 100%);
}

#app{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column; padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.screen{display:none; flex:1; min-height:0; flex-direction:column; animation:screenIn .42s cubic-bezier(.2,.9,.25,1);}
.screen.active{display:flex;}
@keyframes screenIn{from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:none;}}

/* 顶部状态栏 */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex:0 0 auto; margin-bottom:12px;}
.princess{display:flex; align-items:center; gap:10px; padding:7px 16px 7px 8px; border-radius:999px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--stroke); box-shadow:var(--shadow-sm); cursor:pointer; user-select:none;}
.avatar{width:44px; height:44px; border-radius:50%; flex:0 0 auto; background:linear-gradient(145deg,#FFF0F6,#F6D3E4); border:2px solid #fff; box-shadow:0 3px 10px rgba(200,140,170,.28); display:flex; align-items:center; justify-content:center; font-size:20px;}
.princess .meta{display:flex; flex-direction:column; gap:2px;}
.princess .name{font-size:14px; font-weight:700;}
.princess .lv{font-size:11.5px; font-weight:600; color:var(--pink-500); display:flex; align-items:center; gap:4px;}
.lv-dot{width:5px;height:5px;border-radius:50%;background:var(--rose-gold);}

.currency{display:flex; align-items:center; gap:8px;}
.chip{display:flex; align-items:center; gap:7px; padding:8px 15px; border-radius:999px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--stroke); box-shadow:var(--shadow-sm); font-size:14px; font-weight:700;}
.chip .ico{font-size:16px;}
.iconbtn{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--stroke); box-shadow:var(--shadow-sm); cursor:pointer; font-size:16px; transition:transform .18s;}
.iconbtn:active{transform:scale(.93);}

/* 地图页 */
.map-wrap{flex:1; min-height:0; position:relative; display:flex; flex-direction:column; justify-content:center;}
.map-head{padding:0 6px; margin-bottom:6px;}
.map-title{font-family:var(--serif); font-size:clamp(19px,3.2vw,25px); font-weight:700; margin:0; color:var(--ink);}
.map-title em{font-style:normal; background:linear-gradient(96deg,var(--pink-500),var(--rose-gold-deep) 55%,var(--lav-400)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}

.track-outer{flex:1; min-height:0; position:relative; margin:0 -14px; padding:0 14px;}
.track{height:100%; display:flex; align-items:center; gap:clamp(14px,2.6vw,26px); overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; padding:26px 6vw 26px 4px; scrollbar-width:none; cursor:grab;}
.track::-webkit-scrollbar{display:none;}
.track-line{position:absolute; left:0; right:0; top:50%; height:0; border-top:2px dashed rgba(214,168,192,.34); pointer-events:none; z-index:0;}

.node{position:relative; flex:0 0 auto; scroll-snap-align:center; width:clamp(150px,20vw,190px); display:flex; flex-direction:column; align-items:center; gap:11px; border:0; background:none; cursor:pointer; transition:transform .25s;}
.node:active{transform:scale(.97);}
.orb{position:relative; width:clamp(94px,12.4vw,118px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .3s;}
.orb .glyph{font-size:clamp(30px,4.2vw,38px); z-index:3; filter:drop-shadow(0 2px 5px rgba(120,80,110,.22));}

/* 已通关、未解锁、当前节点样式 */
.node.done .orb{background:radial-gradient(circle at 32% 26%, #fff 0%, rgba(255,255,255,.5) 16%, transparent 42%), linear-gradient(150deg,#FFE3EF 0%,#F6B7D1 42%,#E58CAF 100%); box-shadow:0 14px 32px rgba(220,130,166,.36), inset 0 3px 10px rgba(255,255,255,.85);}
.node.locked .orb{background:linear-gradient(150deg,rgba(246,244,248,.9),rgba(226,222,232,.92)); box-shadow:0 8px 20px rgba(150,140,160,.16); filter:saturate(.55); cursor:not-allowed;}
.node.locked .glyph{opacity:.42; filter:grayscale(1);}
.node.current .orb{background:radial-gradient(circle at 30% 24%, #fff, rgba(255,255,255,0) 44%), linear-gradient(148deg,#FFF2F8 0%,#FFCBE4 34%,#F08DBB 72%,#C79BE8 100%); box-shadow:0 18px 44px rgba(226,124,168,.44), 0 0 34px rgba(255,170,214,.55), inset 0 3px 12px rgba(255,255,255,.95); animation:breathe 3.1s infinite;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-5px) scale(1.035);}}

.badge-done{position:absolute; right:-2px; bottom:2px; width:26px; height:26px; border-radius:50%; background:linear-gradient(145deg,#fff,#FFE3EF); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-size:12px; z-index:4;}
.badge-lock{position:absolute; right:0; bottom:0; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; font-size:11px; z-index:4;}

.node-label{text-align:center; max-width:100%;}
.node-label .nm{font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap;}
.node.locked .node-label .nm{color:var(--ink-mute);}
.node .cta{margin-top:2px; font-size:10.5px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--pink-400),var(--rose-gold)); padding:4px 12px; border-radius:999px;}

/* 底部魔法门 */
.gate{flex:0 0 auto; margin-top:12px; border-radius:var(--radius-lg); padding:14px 18px; background:linear-gradient(118deg,rgba(255,255,255,.72),rgba(255,244,249,.58)); backdrop-filter:blur(22px); border:1px solid var(--stroke); box-shadow:var(--shadow-md);}
.gate-head{display:flex; justify-content:space-between; margin-bottom:11px; font-size:13px; font-weight:700;}
.gate-count{color:var(--pink-500);}
.arch{display:flex; justify-content:space-between; gap:8px; padding:10px 20px 12px; border-radius:14px 14px 18px 18px; background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.85);}
.gem{flex:1; max-width:44px; aspect-ratio:1; border-radius:9px; transform:rotate(45deg); background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(238,232,240,.85)); border:1px solid #fff; display:flex; align-items:center; justify-content:center; transition:all .5s;}
.gem > span{transform:rotate(-45deg); font-size:13px; opacity:.35;}
.gem.filled{background:linear-gradient(150deg,#FFD9E9,#F09CC0 52%,#C88FDD); box-shadow:0 4px 14px rgba(230,140,180,.42);}
.gem.filled > span{opacity:1;}

/* 游戏关卡页 */
.game-top{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.backbtn{width:42px; height:42px; border-radius:50%; background:var(--glass); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer;}
.lesson-card{flex:1; border-radius:20px; padding:9px 16px; background:var(--glass); display:flex; align-items:center; gap:12px;}
.lesson-card .rk{font-size:10.5px; font-weight:700; color:#fff; padding:3px 9px; border-radius:999px; background:linear-gradient(135deg,var(--pink-400),var(--rose-gold));}
.lesson-card .lt{font-size:13px; font-weight:700;}

.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;}
.bubble{display:flex; gap:11px; padding:12px 18px; border-radius:20px 20px 20px 6px; background:rgba(255,255,255,.82); box-shadow:var(--shadow-md); max-width:90%;}
.bubble .who{font-size:18px;}
.bubble .txt{font-size:15px; font-weight:600; line-height:1.5;}
.bubble .txt b{color:var(--pink-500);}

.circle-wrap{position:relative; width:clamp(230px,34vh,310px); aspect-ratio:1; display:flex; align-items:center; justify-content:center;}
.summon-circle{position:absolute; inset:0; border-radius:50%; border:1px solid rgba(233,175,205,.5); background:radial-gradient(circle, rgba(255,255,255,.72) 0%, rgba(243,225,248,.12) 70%); box-shadow:inset 0 0 40px rgba(255,255,255,.8); animation:spinSlow 26s linear infinite;}
@keyframes spinSlow{to{transform:rotate(360deg);}}

.synth{position:relative; z-index:3; display:flex; align-items:center; gap:16px;}
.slot{width:70px; height:70px; border-radius:24px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:36px; font-weight:700; color:var(--pink-500); background:rgba(255,255,255,.92); border:1.5px solid #fff; box-shadow:var(--shadow-sm);}
.slot.empty{color:rgba(190,160,180,.4); border-style:dashed;}
.slot.filled{animation:slotPop .42s;}
@keyframes slotPop{0%{transform:scale(.7);} 60%{transform:scale(1.1);} 100%{transform:scale(1);}}
.synth-result{width:100px; height:100px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:34px; font-weight:700; color:#fff; background:linear-gradient(148deg,#FFD3E5,#F090BB 50%,#C08BDF); box-shadow:0 12px 30px rgba(226,124,168,.42); transform:scale(0); transition:transform .5s cubic-bezier(.3,1.6,.5,1);}
.synth-result.show{transform:scale(1);}

.letter-pool{display:flex; gap:18px; flex-wrap:wrap; justify-content:center;}
.letter{width:60px; height:60px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:28px; font-weight:700; color:var(--ink); background:linear-gradient(155deg,#fff,rgba(255,244,250,.85)); border:1.5px solid #fff; box-shadow:var(--shadow-sm); cursor:pointer; transition:all .2s; user-select:none;}
.letter:active{transform:scale(.94);}
.letter.used{opacity:.28; pointer-events:none;}

.spell-zone{display:flex; gap:10px;}
.groove{width:50px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:28px; font-weight:700; border:1.5px dashed rgba(216,168,196,.6); background:rgba(255,255,255,.4); color:transparent; transition:all .28s;}
.groove.active{border-color:var(--pink-300); background:rgba(255,255,255,.75);}
.groove.filled{border-style:solid; color:var(--pink-500); background:linear-gradient(155deg,#fff,#FFF0F7); animation:grooveIn .34s;}
@keyframes grooveIn{0%{transform:translateY(-12px) scale(.85);} 100%{transform:none;}}

.hintline{font-size:12.5px; font-weight:600; color:var(--ink-mute); text-align:center;}
.btn{padding:13px 30px; border-radius:999px; border:0; cursor:pointer; font-size:15px; font-weight:700; color:#fff; background:linear-gradient(135deg,#F294BC,#DC7DA6 50%,#C79BE8); box-shadow:0 10px 26px rgba(224,130,168,.38); transition:transform .18s;}
.btn:active{transform:translateY(2px) scale(.985);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* 弹窗、特效、撒花等 */
.overlay{position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(255,228,242,.55); backdrop-filter:blur(10px);}
.overlay.show{display:flex;}
.result-card{width:min(440px,94vw); border-radius:32px; padding:28px; background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,244,250,.8)); box-shadow:0 32px 70px rgba(170,110,145,.3); text-align:center; animation:cardIn .55s;}
@keyframes cardIn{from{opacity:0; transform:translateY(28px) scale(.9);} to{opacity:1; transform:none;}}
.result-title{font-family:var(--serif); font-size:25px; color:var(--pink-500); margin:0 0 15px;}
.rewards{display:flex; gap:11px; margin-bottom:18px;}
.reward{flex:1; border-radius:20px; padding:15px; background:rgba(255,255,255,.72); box-shadow:0 6px 18px rgba(210,160,190,.14);}
.reward .ri{font-size:23px; display:block; margin-bottom:7px;}
.reward .rv{font-size:21px; font-weight:800; color:var(--pink-500);}
.result-actions{display:flex; gap:10px;}
.result-actions .btn{flex:1; padding:13px 12px;}
.btn.ghost{background:var(--glass-strong); color:var(--ink); box-shadow:var(--shadow-sm);}
.toast{position:fixed; left:50%; bottom:9%; transform:translate(-50%,20px); padding:11px 22px; border-radius:999px; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg,rgba(242,148,188,.96),rgba(200,140,220,.96)); opacity:0; transition:all .32s;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.cf{position:fixed; top:-16px; width:9px; height:9px; animation:cfFall var(--d) linear forwards;}
@keyframes cfFall{0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(108vh) rotate(var(--rot)); opacity:.15;}}

/* 隐藏的家长控制台 */
#parentModal { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
#parentModal.show { display: flex; }
.parent-card { background: #fff; width: 80%; max-width: 400px; padding: 20px; border-radius: 20px; text-align: left;}
.parent-card h3 { margin-top: 0; color: #D96A92; }
.parent-card input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">

  <!-- 地图页 -->
  <section class="screen active" id="screen-map">
    <header class="topbar">
      <div class="princess" id="btnParentMode">
        <div class="avatar">👸</div>
        <div class="meta">
          <span class="name">小公主</span>
          <span class="lv"><i class="lv-dot"></i><span id="lvText">Lv.1 魔法学徒</span></span>
        </div>
      </div>
      <div class="currency">
        <div class="chip"><span class="ico">💎</span><span class="val" id="shardVal">0</span><span class="sub" id="shardSub">碎片</span></div>
        <div class="chip"><span class="ico">⭐</span><span class="val" id="starVal">0</span></div>
        <button class="iconbtn" id="btnSound">🔊</button>
      </div>
    </header>

    <div class="map-wrap">
      <div class="map-head">
        <h1 class="map-title">梦幻城堡 · <em>拼读魔法地图</em></h1>
      </div>
      <div class="track-outer">
        <div class="track-line"></div>
        <div class="track" id="track"></div>
      </div>
    </div>

    <div class="gate">
      <div class="gate-head">
        <span class="gate-title"><span class="k">✦</span> 时空魔法门</span>
        <span class="gate-count" id="gateCount">0 / 11 颗魔法石</span>
      </div>
      <div class="arch" id="arch"></div>
    </div>
  </section>

  <!-- 关卡页 -->
  <section class="screen" id="screen-game">
    <header class="game-top">
      <button class="backbtn" id="btnBack">←</button>
      <div class="lesson-card">
        <span class="rk" id="gRank">第 1 关</span>
        <span class="lt" id="gTitle">魔法觉醒</span>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="bubble" id="bubble">
        <span class="who" id="bubbleWho">🧚‍♀️</span>
        <span class="txt" id="bubbleTxt">准备开始...</span>
      </div>

      <div class="circle-wrap" id="circleWrap">
        <div class="summon-circle"></div>
        <div class="synth" id="synth"></div>
      </div>

      <div class="letter-pool" id="pool"></div>
      <div class="hintline" id="hint"></div>
      <button class="btn" id="btnNext" style="display:none">继续</button>
    </div>
  </section>
</div>

<!-- 弹窗 -->
<div class="overlay" id="overlay">
  <div class="result-card">
    <span class="result-crown" id="resCrown">👑</span>
    <h2 class="result-title" id="resTitle">魔法成功！</h2>
    <div class="rewards">
      <div class="reward"><span class="ri">⭐</span><div class="rv" id="resStar">+3</div></div>
      <div class="reward"><span class="ri">💎</span><div class="rv" id="resShard">+1</div></div>
    </div>
    <!-- 新增：跟读测试区 -->
    <div id="speakZone" style="margin-bottom: 20px; display: none;">
      <p style="font-size: 14px; color: #888; margin-bottom: 10px;">🎤 跟着读一遍，魔法才会生效哦！</p>
      <button class="btn" id="btnSpeak" style="background: #42a5f5; box-shadow: 0 6px 0 #1565c0;">点击开始跟读</button>
      <div id="speakResult" style="font-size: 13px; color: #4caf50; margin-top: 8px; height: 18px;"></div>
    </div>
    
    <div class="result-actions">
      <button class="btn ghost" id="btnAgain">再练一次</button>
      <button class="btn" id="btnMap">回到城堡</button>
    </div>
  </div>
</div>

<!-- 隐藏的家长输入台 -->
<div id="parentModal">
  <div class="parent-card">
    <h3>🧸 家长控制台</h3>
    <p style="font-size: 13px; color: #666;">请输入今天想让孩子复习的单词（用空格或逗号隔开）：</p>
    <input type="text" id="parentWords" placeholder="例如: cat dog bird">
    <div style="display: flex; gap: 10px;">
      <button class="btn ghost" style="flex: 1;" onclick="document.getElementById('parentModal').classList.remove('show')">取消</button>
      <button class="btn" style="flex: 1;" onclick="saveParentWords()">生成关卡</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   1. 数据与状态
   ═══════════════════════════════════════════════════════════════════ */
const SAVE_KEY = 'magic_princess_save_v2';
let S = JSON.parse(localStorage.getItem(SAVE_KEY)) || { stars: 0, shards: 0, stoneFragments: {}, cleared: {}, soundOn: true };

// 默认内置关卡数据
let STONES = [
  {
    id: 1, name: '新手试炼', lesson: '入门', theme: 'A E I', icon: '👑',
    intro: '初入魔法世界，请把字母拼成单词吧！',
    rounds: [{ type: 'spell', word: 'cat', say: 'cat', tip: '短促的 a' }]
  },
  {
    id: 2, name: 'H军团', lesson: '第54讲', theme: 'ch', icon: '🛡️',
    intro: '把 c 和 h 合成，召唤 H 骑士！',
    rounds: [{ type: 'synth', parts: ['c', 'h'], answer: 'ch', say: 'ch' }, { type: 'spell', word: 'chair', say: 'chair' }]
  }
];

// 如果有自定义数据，覆盖内置
if (S.customData && S.customData.length > 0) {
  STONES = S.customData;
}

function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
function updateHUD(){
  document.getElementById('shardVal').textContent = S.shards;
  document.getElementById('starVal').textContent = S.stars;
  const doneCount = Object.values(S.stoneFragments).filter(v => v >= 5).length;
  document.getElementById('gateCount').textContent = `${doneCount} / 11 颗魔法石`;
}
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════════════════════════════════
   2. TTS 语音与录音识别
   ═══════════════════════════════════════════════════════════════════ */
function speak(text, rate=0.85){
  if(!S.soundOn || !text) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate; u.pitch = 1.15;
  let voice = speechSynthesis.getVoices().find(v => v.lang.includes('en-US') && v.name.includes('Female'));
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

// 语音识别（仅支持部分浏览器，如 iOS Safari 需 HTTPS）
let recognition;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
}
function startRecord(targetWord, callback){
  if(!recognition) { toast('当前浏览器不支持录音哦'); callback(true); return; }
  const btn = document.getElementById('btnSpeak');
  const res = document.getElementById('speakResult');
  btn.textContent = '🎤 正在听...'; btn.disabled = true;
  res.textContent = '';
  
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.toLowerCase();
    if (text.includes(targetWord.toLowerCase())) {
      res.textContent = "✅ 太棒了！发音完美！";
      res.style.color = "#4caf50";
      speak("Perfect!");
      setTimeout(() => callback(true), 1000);
    } else {
      res.textContent = `❌ 妈妈听到你读的是 "${text}"，再试一次？`;
      res.style.color = "#f44336";
    }
  };
  recognition.onerror = () => { toast('没听清，再试一次'); callback(false); };
  recognition.onend = () => { btn.textContent = '点击开始跟读'; btn.disabled = false; };
  recognition.start();
}

/* ═══════════════════════════════════════════════════════════════════
   3. 地图渲染
   ═══════════════════════════════════════════════════════════════════ */
function renderMap(){
  const track = document.getElementById('track');
  let currentId = 1;
  for(let i=0; i<STONES.length; i++){
    if((S.stoneFragments[STONES[i].id]||0) < 5) { currentId = STONES[i].id; break; }
  }

  track.innerHTML = STONES.map((st, idx) => {
    const frag = S.stoneFragments[st.id] || 0;
    const done = frag >= 5;
    const unlocked = st.id === 1 || (S.stoneFragments[STONES[idx-1]?.id]||0) >= 5;
    const isCur = st.id === currentId && unlocked && !done;

    let cls = done ? 'done' : (unlocked ? (isCur?'current':'') : 'locked');
    return `
      <button class="node ${cls}" onclick="enterStone(${st.id})">
        <div class="orb"><span class="glyph">${st.icon || '✦'}</span>${done?'<span class="badge-done">✓</span>':(!unlocked?'<span class="badge-lock">🔒</span>':'')}</div>
        <div class="node-label"><div class="nm">${st.name}</div></div>
        ${isCur ? '<span class="cta">开始</span>' : ''}
      </button>`;
  }).join('');
  updateHUD();
}

/* ═══════════════════════════════════════════════════════════════════
   4. 游戏引擎
   ═══════════════════════════════════════════════════════════════════ */
let GAME = { stone: null, roundIdx: 0, synthPicked: [], spellArr: [] };

function enterStone(id) {
  const st = STONES.find(s => s.id === id);
  if(!st) return;
  GAME.stone = st; GAME.roundIdx = 0; GAME.synthPicked = []; GAME.spellArr = [];
  
  document.getElementById('gTitle').textContent = st.name;
  document.getElementById('screen-map').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('bubbleTxt').innerHTML = st.intro;
  
  startRound();
}

function startRound() {
  const r = GAME.stone.rounds[GAME.roundIdx];
  if(!r) { finishGame(); return; }
  
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('pool').innerHTML = '';
  GAME.synthPicked = []; GAME.spellArr = [];

  if(r.type === 'synth') {
    document.getElementById('bubbleTxt').innerHTML = `把 <b>${r.parts.join(' + ')}</b> 合成 <b>${r.answer}</b>！`;
    document.getElementById('synth').innerHTML = r.parts.map((p,i)=>`<div class="slot empty" data-slot="${i}">?</div>`).join('') + `<div class="synth-result" id="synthResult">${r.answer}</div>`;
    document.getElementById('pool').innerHTML = shuffle(r.parts).map(l=>`<button class="letter" onclick="onSynthClick('${l}', this)">${l}</button>`).join('');
  } else {
    document.getElementById('bubbleTxt').innerHTML = `拼出单词 <b>${r.word}</b>！`;
    document.getElementById('synth').innerHTML = `<div class="spell-zone" id="spellZone">${r.word.split('').map((_,i)=>`<div class="groove" data-g="${i}"></div>`).join('')}</div>`;
    GAME.spellArr = new Array(r.word.length).fill(null);
    document.getElementById('pool').innerHTML = shuffle(r.word.split('')).map(l=>`<button class="letter" onclick="onSpellClick('${l}', this)">${l}</button>`).join('');
  }
}

function onSynthClick(ch, btn) {
  btn.classList.add('used');
  speak(ch);
  let idx = GAME.synthPicked.length;
  GAME.synthPicked.push(ch);
  let slot = document.querySelector(`.slot[data-slot="${idx}"]`);
  slot.textContent = ch; slot.classList.remove('empty'); slot.classList.add('filled');
  
  if(GAME.synthPicked.length === GAME.stone.rounds[GAME.roundIdx].parts.length) {
    setTimeout(() => {
      document.getElementById('synthResult').classList.add('show');
      speak(GAME.stone.rounds[GAME.roundIdx].say);
      showNextBtn();
    }, 400);
  }
}

function onSpellClick(ch, btn) {
  let idx = GAME.spellArr.indexOf(null);
  if(idx === -1) return;
  btn.classList.add('used');
  speak(ch);
  GAME.spellArr[idx] = ch;
  let groove = document.querySelector(`.groove[data-g="${idx}"]`);
  groove.textContent = ch; groove.classList.add('filled');
  
  if(GAME.spellArr.indexOf(null) === -1) {
    let word = GAME.spellArr.join('');
    if(word === GAME.stone.rounds[GAME.roundIdx].word) {
      speak(word);
      showNextBtn();
    } else {
      toast("差一点点，再试一次！");
      setTimeout(() => {
        document.querySelectorAll('.groove').forEach(g => { g.textContent=''; g.classList.remove('filled'); });
        document.querySelectorAll('.letter').forEach(b => b.classList.remove('used'));
        GAME.spellArr = new Array(word.length).fill(null);
      }, 800);
    }
  }
}

function showNextBtn(){
  let btn = document.getElementById('btnNext');
  btn.style.display = 'block';
  btn.textContent = "下一个魔法 →";
  btn.onclick = () => { GAME.roundIdx++; startRound(); };
}

function finishGame() {
  const st = GAME.stone;
  let frag = S.stoneFragments[st.id] || 0;
  if(frag < 5) { S.stoneFragments[st.id] = Math.min(5, frag + 2); S.shards += 2; }
  S.stars += 5; persist();
  
  document.getElementById('overlay').classList.add('show');
  document.getElementById('resStar').textContent = "+5";
  document.getElementById('resShard').textContent = "+2";
  updateHUD();

  // 启用麦克风跟读
  const lastRound = st.rounds[st.rounds.length - 1];
  const targetWord = lastRound.word || lastRound.answer;
  document.getElementById('speakZone').style.display = 'block';
  document.getElementById('btnSpeak').onclick = () => {
    startRecord(targetWord, (success) => {
      if(success) document.getElementById('btnMap').style.background = '#4caf50';
    });
  };
}

function shuffle(arr){ return arr.sort(() => Math.random() - 0.5); }

/* ═══════════════════════════════════════════════════════════════════
   5. 家长控制台逻辑（点击头像3次触发）
   ═══════════════════════════════════════════════════════════════════ */
let clickCount = 0; let clickTimer = null;
document.getElementById('btnParentMode').addEventListener('click', () => {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 800);
  if(clickCount >= 3) {
    clickCount = 0;
    document.getElementById('parentModal').classList.add('show');
  }
});

// 保存家长输入的词，并生成游戏数据
function saveParentWords() {
  const input = document.getElementById('parentWords').value;
  if(!input) return;
  
  // 把输入的词按空格或逗号切分
  const words = input.split(/[\s,，]+/).filter(w => w.trim().length > 0);
  
  // 生成关卡数据
  const newStones = words.map((w, index) => ({
    id: index + 1,
    name: `复习词 ${index+1}`,
    icon: '🌟',
    intro: `挑战拼写单词：${w}`,
    rounds: [{ type: 'spell', word: w, say: w }]
  }));
  
  S.customData = newStones;
  persist();
  
  document.getElementById('parentModal').classList.remove('show');
  toast('关卡已重新生成！');
  setTimeout(() => location.reload(), 1000);
}

/* ═══════════════════════════════════════════════════════════════════
   6. 启动与事件绑定
   ═══════════════════════════════════════════════════════════════════ */
document.getElementById('btnBack').onclick = () => {
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-map').classList.add('active');
  document.getElementById('speakZone').style.display = 'none';
  renderMap();
};
document.getElementById('btnMap').onclick = () => {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-map').classList.add('active');
  document.getElementById('speakZone').style.display = 'none';
  renderMap();
};
document.getElementById('btnAgain').onclick = () => {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('speakZone').style.display = 'none';
  GAME.roundIdx = 0;
  startRound();
};
document.getElementById('btnSound').onclick = function() {
  S.soundOn = !S.soundOn; persist();
  this.textContent = S.soundOn ? '🔊' : '🔇';
  if(!S.soundOn) speechSynthesis.cancel();
};

// 初始化
renderMap();
</script>
